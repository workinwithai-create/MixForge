name: MixForge tests

on:
  push:
    branches:
      - mixforge-2-3-problem-timeline
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: python -m py_compile runpod-separator/handler.py runpod-separator/benchmark.py
      - run: npm test
