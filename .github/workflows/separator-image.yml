name: Separator image build

on:
  pull_request:
    branches:
      - main
    paths:
      - 'runpod-separator/**'
      - '.github/workflows/separator-image.yml'

permissions:
  contents: read

jobs:
  build-separator-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build RunPod separator image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: runpod-separator/Dockerfile
          push: false
          build-args: |
            PRELOAD_MELBAND=false
            BUILD_REVISION=ci-${{ github.sha }}
          cache-from: type=gha,scope=mixforge-separator
          cache-to: type=gha,mode=max,scope=mixforge-separator
