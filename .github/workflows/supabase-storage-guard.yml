name: Supabase Storage Guard

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Check only, or restore the configured minimum when needed
        required: true
        default: enforce
        type: choice
        options:
          - check
          - enforce
  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: supabase-storage-guard
  cancel-in-progress: false

env:
  SUPABASE_PROJECT_REF: xbzypzgnwgrmmvtrmdzl
  REQUIRED_FILE_SIZE_BYTES: "300000000"

jobs:
  storage-limit:
    name: Keep MixForge uploads at 300 MB
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check whether the access token is configured
        id: token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          if [[ -z "$SUPABASE_ACCESS_TOKEN" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Supabase guard inactive::Add the SUPABASE_ACCESS_TOKEN repository secret to activate this guard."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Read current Supabase Storage configuration
        if: steps.token.outputs.configured == 'true'
        id: current
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/storage")"

          current_limit="$(node -e '
            const data = JSON.parse(process.argv[1]);
            const limit = Number(data.fileSizeLimit);
            if (!Number.isFinite(limit)) process.exit(2);
            process.stdout.write(String(limit));
          ' "$response")"

          echo "file_size_limit=$current_limit" >> "$GITHUB_OUTPUT"
          echo "Current Supabase global file-size limit: $current_limit bytes"

      - name: Restore the 300 MB minimum
        if: >-
          steps.token.outputs.configured == 'true' &&
          steps.current.outputs.file_size_limit < env.REQUIRED_FILE_SIZE_BYTES &&
          (github.event_name == 'schedule' || inputs.mode == 'enforce')
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          curl --silent --show-error --fail-with-body \
            --request PATCH \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data "{\"fileSizeLimit\":$REQUIRED_FILE_SIZE_BYTES}" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/storage" \
            >/dev/null
          echo "Restored Supabase global file-size limit to $REQUIRED_FILE_SIZE_BYTES bytes."

      - name: Verify the effective limit
        if: steps.token.outputs.configured == 'true'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --silent --show-error --fail-with-body \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/config/storage")"

          current_limit="$(node -e '
            const data = JSON.parse(process.argv[1]);
            const limit = Number(data.fileSizeLimit);
            if (!Number.isFinite(limit)) process.exit(2);
            process.stdout.write(String(limit));
          ' "$response")"

          if (( current_limit < REQUIRED_FILE_SIZE_BYTES )); then
            echo "::error title=Supabase Storage limit too low::Current limit is $current_limit bytes; MixForge requires at least $REQUIRED_FILE_SIZE_BYTES bytes."
            exit 1
          fi

          echo "Supabase Storage guard passed at $current_limit bytes."
